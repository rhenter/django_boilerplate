[project]
name = "django-boilerplate"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boltons>=26.2.0",
    "boto3>=1.43.114",
    "brazilfiscalreport>=1.3.1",
    "celery-types>=0.26.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "dj-database-url>=3.1.2",
    "dj-static>=0.0.6",
    "django-cache-url>=3.4.6",
    "django-celery-beat>=2.9.0",
    "django-celery-logs>=0.2.3",
    "django-ckeditor-5>=0.2.20",
    "django-clearcache>=1.2.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "django-models>=1.0",
    "django-redis>=7.0.0",
    "django-storages>=1.14.6",
    "django>=6.0.9",
    "djangorestframework-simplejwt>=5.5.1",
    "djangorestframework-stubs>=3.18.1",
    "djangorestframework>=3.18.3",
    "drf-yasg>=1.21.18",
    "gunicorn>=26.2.0",
    "json-log-formatter>=1.2.1",
    "pillow>=12.3.0",
    "pika>=1.3.2",
    "prettyconf>=3.0.1",
    "psycopg[binary]>=3.3.6",
    "pyotp>=2.10.0",
    "pdfrw>=0.4",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.1.0",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "rest-condition>=1.0.3",
    "sentry-sdk>=2.72.0",
    "unipath>=1.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-django>=4.14,<5",
    "pytest-xdist>=3.8,<4",
]
dev = [
    { include-group = "test" },
    "ipython",
]

[tool.uv]
package = false
