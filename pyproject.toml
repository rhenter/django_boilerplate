[project]
name = "django-boilerplate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "celery>=5.5,<6",
    "dj-database-url>=2.3,<4",
    "django-celery-logs>=0.2.1,<1",
    "django-cors-headers>=4.7,<5",
    "django-filter>=25.1,<26",
    "django-redis>=5.4,<7",
    "djangorestframework>=3.15,<4",
    "python-dotenv>=1,<2",
    "redis>=5,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-django>=4.10,<5",
    "pytest-xdist>=3.6,<4",
]

[tool.uv]
package = false
